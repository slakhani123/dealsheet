name: Fetch brand assets from SharePoint

# NOTE: currently blocked — the Azure app registration behind the repo's
# AZURE_* secrets has no Microsoft Graph application permissions granted
# (token carries no roles; this is also why every "Upload deal sheet to
# SharePoint" run has failed). Grant the app Sites.Read.All (or
# Sites.Selected on the RELfinance site) in Entra ID, then dispatch this
# workflow to pull the real logo PNG, theme CSS and statement workbook.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download brand assets via Microsoft Graph
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_HOSTNAME: ${{ vars.SHAREPOINT_HOSTNAME }}
          SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH }}
        run: python3 automation/fetch_brand_assets.py

      - name: Commit assets to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brand-assets
          git diff --cached --quiet || git commit -m "Add REL brand assets fetched from SharePoint"
          git push
